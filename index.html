<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flexbox Sandbox (Géant)</title>
    <link rel="stylesheet" href="main.css" />
</head>
<body>
<header class="top">
    <h1>Flexbox Sandbox (Géant)</h1>
    <p class="hint">
        Objectif: comprendre Flexbox en jouant. À gauche: container. À droite: item sélectionné.
        En bas: CSS généré.
    </p>
</header>

<main class="layout">
    <!-- CONTROLS -->
    <section class="panel">
        <div class="panel-head">
            <h2>Réglages</h2>
            <div class="btns">
                <button id="presetCenter" type="button">Preset: centrer</button>
                <button id="presetWrap" type="button">Preset: wrap demo</button>
                <button id="preset2col" type="button">Preset: 2 colonnes</button>
                <button id="reset" type="button" class="primary">Reset</button>
            </div>
        </div>

        <div class="grid">
            <!-- CONTAINER -->
            <fieldset class="group">
                <legend>Container</legend>

                <label>
                    flex-direction
                    <select id="direction">
                        <option value="row" selected>row (default)</option>
                        <option value="row-reverse">row-reverse</option>
                        <option value="column">column</option>
                        <option value="column-reverse">column-reverse</option>
                    </select>
                </label>

                <label>
                    justify-content (axe principal)
                    <select id="justify">
                        <option value="flex-start" selected>flex-start (default)</option>
                        <option value="center">center</option>
                        <option value="flex-end">flex-end</option>
                        <option value="space-between">space-between</option>
                        <option value="space-around">space-around</option>
                        <option value="space-evenly">space-evenly</option>
                    </select>
                </label>

                <label>
                    align-items (axe secondaire)
                    <select id="alignItems">
                        <option value="stretch" selected>stretch (default)</option>
                        <option value="flex-start">flex-start</option>
                        <option value="center">center</option>
                        <option value="flex-end">flex-end</option>
                        <option value="baseline">baseline</option>
                    </select>
                </label>

                <label>
                    flex-wrap
                    <select id="wrap">
                        <option value="nowrap" selected>nowrap (default)</option>
                        <option value="wrap">wrap</option>
                        <option value="wrap-reverse">wrap-reverse</option>
                    </select>
                </label>

                <label>
                    align-content (lignes; utile avec wrap)
                    <select id="alignContent">
                        <option value="stretch" selected>stretch (default)</option>
                        <option value="flex-start">flex-start</option>
                        <option value="center">center</option>
                        <option value="flex-end">flex-end</option>
                        <option value="space-between">space-between</option>
                        <option value="space-around">space-around</option>
                        <option value="space-evenly">space-evenly</option>
                    </select>
                </label>

                <label class="range">
                    gap: <span id="gapValue">12</span>px
                    <input id="gap" type="range" min="0" max="40" value="12" />
                </label>

                <label class="range">
                    row-gap: <span id="rowGapValue">12</span>px
                    <input id="rowGap" type="range" min="0" max="40" value="12" />
                </label>

                <label class="range">
                    column-gap: <span id="colGapValue">12</span>px
                    <input id="colGap" type="range" min="0" max="40" value="12" />
                </label>

                <label class="range">
                    largeur container: <span id="wValue">100</span>%
                    <input id="containerW" type="range" min="40" max="100" value="100" />
                </label>

                <label class="range">
                    hauteur container: <span id="hValue">320</span>px
                    <input id="containerH" type="range" min="180" max="520" value="320" />
                </label>
            </fieldset>

            <!-- ITEM -->
            <fieldset class="group">
                <legend>Item (sélection)</legend>

                <label>
                    item sélectionné
                    <select id="selectedItem"></select>
                </label>

                <label class="range">
                    order: <span id="orderValue">0</span>
                    <input id="order" type="range" min="-5" max="10" value="0" />
                </label>

                <label class="range">
                    flex-grow: <span id="growValue">0</span>
                    <input id="grow" type="range" min="0" max="5" value="0" />
                </label>

                <label class="range">
                    flex-shrink: <span id="shrinkValue">1</span>
                    <input id="shrink" type="range" min="0" max="5" value="1" />
                </label>

                <label>
                    flex-basis
                    <select id="basis">
                        <option value="auto" selected>auto (default)</option>
                        <option value="0">0</option>
                        <option value="80px">80px</option>
                        <option value="120px">120px</option>
                        <option value="160px">160px</option>
                        <option value="200px">200px</option>
                        <option value="25%">25%</option>
                        <option value="33.33%">33.33%</option>
                        <option value="50%">50%</option>
                    </select>
                </label>

                <label>
                    align-self (sur l’axe secondaire)
                    <select id="alignSelf">
                        <option value="auto" selected>auto (default)</option>
                        <option value="stretch">stretch</option>
                        <option value="flex-start">flex-start</option>
                        <option value="center">center</option>
                        <option value="flex-end">flex-end</option>
                        <option value="baseline">baseline</option>
                    </select>
                </label>

                <label class="range">
                    min-width item: <span id="minWValue">70</span>px
                    <input id="minW" type="range" min="40" max="240" value="70" />
                </label>

                <label class="range">
                    font-size item: <span id="fontValue">16</span>px
                    <input id="fontSize" type="range" min="12" max="36" value="16" />
                </label>

                <label class="range">
                    nombre d’items: <span id="countValue">5</span>
                    <input id="count" type="range" min="3" max="12" value="5" />
                </label>

                <label class="check">
                    <input id="multiLine" type="checkbox" />
                    Item 2 avec texte sur 2 lignes (baseline)
                </label>
            </fieldset>
        </div>
    </section>

    <!-- STAGE -->
    <section class="stageWrap">
        <div class="stage">
            <div id="container" class="container" aria-label="Flex container">
                <!-- items injectés en JS -->
            </div>
        </div>

        <div class="cssOutWrap">
            <h3>CSS généré</h3>
            <pre class="code"><code id="cssOut"></code></pre>
        </div>
    </section>
</main>

<script src="index.js"></script>
</body>
</html>
